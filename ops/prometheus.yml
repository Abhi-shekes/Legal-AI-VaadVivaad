# Optional, entirely self-hosted metrics collection.
#   docker compose --profile observability up -d
# Prometheus and Grafana are both open source; nothing is sent anywhere.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: vaadvivaad-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Qdrant also exposes /metrics, but behind the same api-key as the rest of
  # its API. To scrape it, put the key in a file mounted into this container
  # and add here:
  #   - job_name: qdrant
  #     metrics_path: /metrics
  #     http_headers:
  #       api-key:
  #         files: ["/etc/prometheus/qdrant-api-key"]
  #     static_configs:
  #       - targets: ["qdrant:6333"]
  # The backend already publishes vaadvivaad_corpus_size, which is the one
  # Qdrant number worth alerting on, so this is left off by default.
