name: vaadvivaad

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    container_name: vaadvivaad-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-vaadvivaad}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme_dev_password}
    volumes:
      - vaadvivaad-mongo-data:/data/db
    networks:
      - vaadvivaad-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u", "${MONGO_ROOT_USERNAME:-vaadvivaad}",
          "-p", "${MONGO_ROOT_PASSWORD:-changeme_dev_password}",
          "--authenticationDatabase", "admin",
          "--eval", "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    # Keep this in the same minor version as qdrant-client in requirements.txt
    # (1.19.x) -- Qdrant enforces client/server compatibility within one
    # minor version and the client refuses/warns otherwise.
    image: qdrant/qdrant:v1.19.1
    container_name: vaadvivaad-qdrant
    restart: unless-stopped
    # No QDRANT__SERVICE__API_KEY here on purpose: Qdrant treats the mere
    # *presence* of that env var as "auth required", even set to an empty
    # string -- so wiring it to an optional/blank QDRANT_API_KEY here would
    # lock the backend itself out by default. If you want auth on Qdrant,
    # add `QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set it}` yourself
    # (the backend already reads QDRANT_API_KEY correctly either way).
    volumes:
      - vaadvivaad-qdrant-data:/qdrant/storage
    ports:
      # REST API + web dashboard (http://localhost:6333/dashboard) -- handy
      # for inspecting collections during local development. Loopback-only
      # so it's not reachable off this machine; drop the mapping entirely
      # if you don't want it reachable from the host at all.
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    networks:
      - vaadvivaad-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./vaadvivaad-backend
    image: vaadvivaad-backend:latest
    container_name: vaadvivaad-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-vaadvivaad}:${MONGO_ROOT_PASSWORD:-changeme_dev_password}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-vaadvivaad}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-stub-google-api-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - vaadvivaad-network
    logging: *default-logging
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./vaadvivaad-frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        VITE_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:8000}
        VITE_BASE_PATH: /
    image: vaadvivaad-frontend:latest
    container_name: vaadvivaad-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    networks:
      - vaadvivaad-network
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  vaadvivaad-network:
    name: vaadvivaad-network
    driver: bridge

volumes:
  vaadvivaad-mongo-data:
    name: vaadvivaad-mongo-data
  vaadvivaad-qdrant-data:
    name: vaadvivaad-qdrant-data
