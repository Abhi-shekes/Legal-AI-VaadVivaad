name: vaadvivaad

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    container_name: vaadvivaad-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-vaadvivaad}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
    volumes:
      - vaadvivaad-mongo-data:/data/db
    networks:
      - vaadvivaad-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u", "${MONGO_ROOT_USERNAME:-vaadvivaad}",
          "-p", "${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}",
          "--authenticationDatabase", "admin",
          "--eval", "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    # Keep this in the same minor version as qdrant-client in requirements.txt
    # (1.19.x) -- Qdrant enforces client/server compatibility within one
    # minor version and the client refuses/warns otherwise.
    image: qdrant/qdrant:v1.19.1
    container_name: vaadvivaad-qdrant
    restart: unless-stopped
    environment:
      # Qdrant treats the mere *presence* of this env var as "auth
      # required", even set to an empty string -- so QDRANT_API_KEY must
      # be a real value in .env, never blank, or this locks the backend
      # itself out too. The backend reads the same QDRANT_API_KEY.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}
    volumes:
      - vaadvivaad-qdrant-data:/qdrant/storage
    ports:
      # REST API + web dashboard (http://localhost:6333/dashboard) -- handy
      # for inspecting collections during local development. Loopback-only
      # so it's not reachable off this machine; drop the mapping entirely
      # if you don't want it reachable from the host at all.
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    networks:
      - vaadvivaad-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaadvivaad-redis
    restart: unless-stopped
    # Sessions and rate-limit counters are recoverable state, but losing every
    # in-flight hearing on a restart is not acceptable, so persist.
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - vaadvivaad-redis-data:/data
    networks:
      - vaadvivaad-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./vaadvivaad-backend
    image: vaadvivaad-backend:latest
    container_name: vaadvivaad-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-vaadvivaad}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-vaadvivaad}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-gemini-flash-lite-latest}
      GEMINI_MODEL_REASONING: ${GEMINI_MODEL_REASONING:-gemini-flash-lite-latest}
      DEBATE_MAX_ROUNDS: ${DEBATE_MAX_ROUNDS:-4}
      DEBATE_TOKEN_BUDGET: ${DEBATE_TOKEN_BUDGET:-120000}
      RATELIMIT_DEBATE: ${RATELIMIT_DEBATE:-5/3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - vaadvivaad-network
    logging: *default-logging
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./vaadvivaad-frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        VITE_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:8000}
        VITE_BASE_PATH: /
    image: vaadvivaad-frontend:latest
    container_name: vaadvivaad-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    networks:
      - vaadvivaad-network
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- optional: TLS termination (profile: tls) ---
  # Caddy gets and renews Let's Encrypt certificates by itself. No cloud load
  # balancer and no certificate purchase; see ops/README.md.
  caddy:
    image: caddy:2-alpine
    container_name: vaadvivaad-caddy
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - vaadvivaad-caddy-data:/data
      - vaadvivaad-caddy-config:/config
    networks:
      - vaadvivaad-network
    logging: *default-logging
    depends_on:
      - backend
      - frontend

  # --- optional: metrics (profile: observability) ---
  # Both open source, both entirely local. Nothing leaves the machine.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vaadvivaad-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vaadvivaad-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - vaadvivaad-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: vaadvivaad-grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - vaadvivaad-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - vaadvivaad-network
    logging: *default-logging
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m

networks:
  vaadvivaad-network:
    name: vaadvivaad-network
    driver: bridge

volumes:
  vaadvivaad-caddy-data:
    name: vaadvivaad-caddy-data
  vaadvivaad-caddy-config:
    name: vaadvivaad-caddy-config
  vaadvivaad-prometheus-data:
    name: vaadvivaad-prometheus-data
  vaadvivaad-grafana-data:
    name: vaadvivaad-grafana-data
  vaadvivaad-redis-data:
    name: vaadvivaad-redis-data
  vaadvivaad-mongo-data:
    name: vaadvivaad-mongo-data
  vaadvivaad-qdrant-data:
    name: vaadvivaad-qdrant-data
