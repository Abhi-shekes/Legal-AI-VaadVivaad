name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaadvivaad-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vaadvivaad-backend/requirements.txt
      - run: pip install -r requirements.txt

      # The suite is stdlib unittest so it runs identically here, on a
      # developer machine, and inside the backend container.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test
          JWT_SECRET_KEY: ci-secret-key-not-used-for-anything-real-0000
          GOOGLE_API_KEY: ci-placeholder
          ENVIRONMENT: test

      - name: Import check
        run: python -c "import app.main"
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test
          JWT_SECRET_KEY: ci-secret-key-not-used-for-anything-real-0000
          GOOGLE_API_KEY: ci-placeholder
          ENVIRONMENT: test

      # The IPC/BNS table is data, never model output. This fails the build if
      # someone marks entries verified without recording who reviewed them.
      - name: Concordance integrity
        run: python -m app.services.checks.concordance_check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaadvivaad-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vaadvivaad-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_SOCKET_URL: http://localhost:8000

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=ci-secret-key-not-used-for-anything-real-0000/' .env
          sed -i 's/^MONGO_ROOT_PASSWORD=.*/MONGO_ROOT_PASSWORD=ci-password/' .env
          sed -i 's/^QDRANT_API_KEY=.*/QDRANT_API_KEY=ci-key/' .env
          sed -i 's/^GOOGLE_API_KEY=.*/GOOGLE_API_KEY=ci-placeholder/' .env
          docker compose config --quiet
